<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>J.A.R.V.I.S AI</title>

<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header class="topbar">
        <div>
            <h1>J.A.R.V.I.S</h1>
            <span>MOBILE AI ASSISTANT</span>
        </div>

        <div class="online">
            <i></i>
            ONLINE
        </div>
    </header>


    <main>

        <!-- ARC CORE -->

        <section class="core-section">

            <div class="core">

                <div class="ring ring-one"></div>
                <div class="ring ring-two"></div>
                <div class="ring ring-three"></div>

                <div class="core-energy">
                    <div class="core-dot"></div>
                </div>

            </div>

            <h2>J.A.R.V.I.S</h2>
            <p class="core-status">AI CORE ACTIVE</p>

        </section>


        <!-- SYSTEM STATUS -->

        <section class="panel">

            <div class="panel-title">
                <span>SYSTEM STATUS</span>
                <span>●</span>
            </div>

            <div class="status-row">
                <span>AI CORE</span>
                <b class="green">ONLINE</b>
            </div>

            <div class="status-row">
                <span>NETWORK</span>
                <b class="green">CONNECTED</b>
            </div>

            <div class="status-row">
                <span>VOICE</span>
                <b id="voiceStatus">READY</b>
            </div>

            <div class="status-row">
                <span>MEMORY</span>
                <b class="yellow">ACTIVE</b>
            </div>

        </section>


        <!-- CHAT -->

        <section class="chat-panel">

            <div class="chat-header">
                <span>J.A.R.V.I.S COMMUNICATION</span>
                <span>SECURE</span>
            </div>

            <div id="chat" class="chat">

                <div class="msg ai">
                    <span class="label">J.A.R.V.I.S</span>
                    Good evening, Boss. Systems are online.
                    How may I assist you?
                </div>

            </div>

        </section>


        <!-- INPUT -->

        <section class="input-area">

            <input
                id="msg"
                type="text"
                placeholder="Ask J.A.R.V.I.S..."
                autocomplete="off"
            >

            <button id="send">
                SEND
            </button>

        </section>


        <!-- VOICE -->

        <button id="voiceBtn" class="voice-button">
            🎙 START VOICE
        </button>

    </main>


    <footer>
        J.A.R.V.I.S AI SYSTEM • MOBILE EDITION
    </footer>

</div>

<script src="script.js"></script>

</body>
</html>
